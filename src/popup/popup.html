<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapMonk</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>

  <!-- Header -->
  <header style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #30363D;">
    <img src="../../icons/icon32.png" width="24" height="24" alt="SnapMonk" style="border-radius:6px;">
    <div>
      <div style="font-size:14px;font-weight:700;color:#E6EDF3;letter-spacing:-0.01em;">SnapMonk</div>
      <div style="font-size:10px;color:#8B949E;margin-top:-1px;">by DevOps-Monk</div>
    </div>
    <div id="status-badge" style="margin-left:auto;font-size:10px;color:#10B981;display:none;align-items:center;gap:4px;">
      <span style="width:6px;height:6px;border-radius:50%;background:#10B981;display:inline-block;"></span>
      <span id="status-text">Capturing…</span>
    </div>
  </header>

  <!-- Capture Section -->
  <div class="section-label">Capture</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px;">

    <!-- Visible Area -->
    <button class="capture-btn" id="btn-visible">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 7.125C2.25 6.504 2.754 6 3.375 6h6c.621 0 1.125.504 1.125 1.125v3.75c0 .621-.504 1.125-1.125 1.125h-6a1.125 1.125 0 0 1-1.125-1.125v-3.75ZM14.25 8.625c0-.621.504-1.125 1.125-1.125h5.25c.621 0 1.125.504 1.125 1.125v8.25c0 .621-.504 1.125-1.125 1.125h-5.25a1.125 1.125 0 0 1-1.125-1.125v-8.25ZM3.75 16.125c0-.621.504-1.125 1.125-1.125h5.25c.621 0 1.125.504 1.125 1.125v2.25c0 .621-.504 1.125-1.125 1.125h-5.25a1.125 1.125 0 0 1-1.125-1.125v-2.25Z"/>
      </svg>
      <span>Visible Area</span>
      <span class="shortcut">⌥⇧S</span>
    </button>

    <!-- Full Page -->
    <button class="capture-btn" id="btn-fullpage">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
      </svg>
      <span>Full Page</span>
      <span class="shortcut">⌥⇧F</span>
    </button>

    <!-- Region Select -->
    <button class="capture-btn" id="btn-region">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M7.848 8.25l1.536.887M7.848 8.25a3 3 0 1 1-5.196-3 3 3 0 0 1 5.196 3Zm1.536.887a2.165 2.165 0 0 1 1.083 1.839c.005.351.054.695.14 1.024M9.384 9.137l2.077 1.199M7.848 15.75l1.536-.887m-1.536.887a3 3 0 1 1-5.196 3 3 3 0 0 1 5.196-3Zm1.536-.887a2.165 2.165 0 0 1 1.083-1.838c.05-.245.077-.497.08-.752m-1.163 2.59 2.077-1.2m0 0l2.077 1.2M12 12.75a2.165 2.165 0 0 0 .354 1.198l.scorecard.14 1.024"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.25V6a2.25 2.25 0 0 1 2.25-2.25h2.25M15.75 3.75H18A2.25 2.25 0 0 1 20.25 6v2.25M20.25 15.75V18A2.25 2.25 0 0 1 18 20.25h-2.25M8.25 20.25H6A2.25 2.25 0 0 1 3.75 18v-2.25"/>
      </svg>
      <span>Region Select</span>
      <span class="shortcut">⌥⇧R</span>
    </button>

    <!-- Element Picker -->
    <button class="capture-btn" id="btn-element">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672Zm-7.518-.267A8.25 8.25 0 1 1 20.25 10.5M8.288 14.212A5.25 5.25 0 1 1 17.25 10.5"/>
      </svg>
      <span>Element Pick</span>
      <span class="shortcut">hover</span>
    </button>

  </div>

  <div class="divider"></div>

  <!-- Record Section -->
  <div class="section-label">Record</div>
  <div style="padding:0 12px 12px;">

    <!-- Record trigger button -->
    <button class="record-btn" id="btn-record-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" style="width:18px;height:18px;">
        <path stroke-linecap="round" d="M15.75 10.5l4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z"/>
      </svg>
      <span id="btn-record-label">Record Screen</span>
    </button>

    <!-- Recording options panel (shown when not recording) -->
    <div id="record-options" style="display:none;margin-top:10px;background:#161B22;border:1px solid #30363D;border-radius:10px;overflow:hidden;">

      <!-- Mode -->
      <div style="padding:10px 12px 6px;">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#8B949E;margin-bottom:6px;">Mode</div>
        <div style="display:flex;gap:6px;">
          <button class="mode-btn active" data-mode="tab" style="flex:1;padding:6px 4px;border-radius:7px;border:1px solid #30363D;background:#21262D;color:#E6EDF3;font-size:11px;font-weight:600;cursor:pointer;">
            Tab
          </button>
          <button class="mode-btn" data-mode="desktop" style="flex:1;padding:6px 4px;border-radius:7px;border:1px solid #30363D;background:transparent;color:#8B949E;font-size:11px;font-weight:600;cursor:pointer;">
            Desktop
          </button>
          <button class="mode-btn" data-mode="window" style="flex:1;padding:6px 4px;border-radius:7px;border:1px solid #30363D;background:transparent;color:#8B949E;font-size:11px;font-weight:600;cursor:pointer;">
            Window
          </button>
        </div>
      </div>

      <div style="height:1px;background:#21262D;"></div>

      <!-- Toggles -->
      <div style="padding:8px 12px;display:flex;flex-direction:column;gap:6px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#E6EDF3;">
          <input type="checkbox" id="opt-webcam" checked style="accent-color:#7C3AED;width:14px;height:14px;">
          <span>📹 Webcam overlay</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#E6EDF3;">
          <input type="checkbox" id="opt-mic" checked style="accent-color:#7C3AED;width:14px;height:14px;">
          <span>🎙 Microphone</span>
        </label>
      </div>

      <div style="height:1px;background:#21262D;"></div>

      <!-- Start button -->
      <div style="padding:10px 12px;">
        <button id="btn-record-start" style="width:100%;padding:9px;background:#7C3AED;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .12s;">
          <span style="width:8px;height:8px;border-radius:50%;background:#fff;"></span>
          Start Recording
        </button>
      </div>
    </div>

    <!-- Active recording status (shown during recording) -->
    <div id="record-active" style="display:none;margin-top:10px;background:#161B22;border:1px solid rgba(248,81,73,0.4);border-radius:10px;padding:10px 12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:8px;height:8px;border-radius:50%;background:#F85149;animation:pulse 1.2s infinite;flex-shrink:0;"></div>
        <span style="font-size:12px;font-weight:700;color:#F85149;letter-spacing:.05em;">RECORDING</span>
        <span id="rec-live-timer" style="font-size:13px;font-weight:600;color:#E6EDF3;margin-left:auto;font-variant-numeric:tabular-nums;">00:00</span>
      </div>
      <button id="btn-record-stop" style="width:100%;margin-top:10px;padding:8px;background:#F85149;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" style="width:12px;height:12px;"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Stop & Save
      </button>
    </div>

  </div>

  <div class="divider"></div>

  <!-- Footer -->
  <footer style="display:flex;align-items:center;padding:8px 8px;">
    <button class="footer-btn" id="btn-options">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" style="width:14px;height:14px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
      </svg>
      Settings
    </button>
    <button class="footer-btn" id="btn-library" style="margin-left:auto;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" style="width:14px;height:14px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
      </svg>
      My Captures
    </button>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
