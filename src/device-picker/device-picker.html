<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapMonk — Device Access</title>
  <link rel="stylesheet" href="./device-picker.css">
</head>
<body>

  <div class="dp-header">
    <img src="../../icons/icon32.png" width="22" height="22" alt="SnapMonk">
    <div class="dp-header-text">
      <span class="dp-brand">SnapMonk</span>
      <span class="dp-wants">wants to</span>
    </div>
  </div>

  <div class="dp-permissions">
    <div class="dp-perm-row" id="dp-perm-camera">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="15" height="15"><circle cx="12" cy="13" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/></svg>
      <span id="dp-perm-camera-label">Use available cameras</span>
    </div>
    <div class="dp-perm-row" id="dp-perm-mic">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="15" height="15"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"/></svg>
      <span id="dp-perm-mic-label">Use available microphones</span>
    </div>
  </div>

  <div class="dp-preview-wrap">
    <video id="dp-camera-preview" autoplay muted playsinline></video>
    <div id="dp-permission-msg" class="dp-permission-msg">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
      <span>Requesting camera access…</span>
    </div>
  </div>

  <div class="dp-field">
    <label class="dp-label">Camera</label>
    <select id="dp-camera-select" class="dp-select" disabled>
      <option>Waiting for permission…</option>
    </select>
  </div>

  <div class="dp-mic-wrap">
    <div class="dp-mic-level-track">
      <div id="dp-mic-level" class="dp-mic-level-fill"></div>
    </div>
  </div>

  <div class="dp-field">
    <label class="dp-label">Microphone</label>
    <select id="dp-mic-select" class="dp-select" disabled>
      <option>Waiting for permission…</option>
    </select>
  </div>

  <div class="dp-actions">
    <button id="dp-allow-all" class="dp-btn dp-btn-primary" disabled>Allow while visiting the site</button>
    <button id="dp-allow-once" class="dp-btn dp-btn-secondary" disabled>Allow this time</button>
    <button id="dp-deny" class="dp-btn dp-btn-danger">Never allow</button>
  </div>

  <script type="module" src="./device-picker.ts"></script>
</body>
</html>
