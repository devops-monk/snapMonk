name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create zip
        run: |
          cd dist && zip -r ../snapmonk.zip . && cd ..
          echo "ZIP_SIZE=$(du -sh snapmonk.zip | cut -f1)" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "### Build complete" >> $GITHUB_STEP_SUMMARY
          echo "Zip size: **${{ env.ZIP_SIZE }}**" >> $GITHUB_STEP_SUMMARY

      # PRs: just upload as artifact so reviewers can test
      - name: Upload zip artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: snapmonk-pr${{ github.event.pull_request.number }}.zip
          path: snapmonk.zip
          retention-days: 14

      # Main branch: update the rolling "latest" release so there's always
      # a direct download link at github.com/devops-monk/snapMonk/releases/latest
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            Automated build from the latest commit on `main`.

            **How to install in Chrome:**
            1. Download `snapmonk.zip` below
            2. Unzip it anywhere on your machine
            3. Open `chrome://extensions`
            4. Enable **Developer Mode** (top-right toggle)
            5. Click **Load unpacked** → select the unzipped folder
            6. Pin SnapMonk from the 🧩 toolbar menu

            > To update: repeat steps 1-5 (click the ↺ refresh icon on the card instead of Load unpacked if already installed).

            _Commit: ${{ github.sha }}_
          prerelease: true
          make_latest: true
          files: snapmonk.zip
