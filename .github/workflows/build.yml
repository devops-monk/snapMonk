name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed to create/update releases

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for accurate commit-count versioning

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version from commit count
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COMMIT_COUNT}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          jq ".version = \"$VERSION\"" manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
          jq ".version = \"$VERSION\"" package.json  > package.json.tmp  && mv package.json.tmp  package.json
          echo "Version set to $VERSION"

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Build
        run: npm run build

      - name: Create zip
        run: |
          cd dist && zip -r ../snapmonk.zip . && cd ..
          echo "ZIP_SIZE=$(du -sh snapmonk.zip | cut -f1)" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "### Build complete" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ env.VERSION }}**" >> $GITHUB_STEP_SUMMARY
          echo "Zip size: **${{ env.ZIP_SIZE }}**" >> $GITHUB_STEP_SUMMARY

      # PRs: just upload as artifact so reviewers can test
      - name: Upload zip artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: snapmonk-pr${{ github.event.pull_request.number }}.zip
          path: snapmonk.zip
          retention-days: 14

      # Main branch: update the rolling "latest" release
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "v${{ env.VERSION }}"
          body: |
            Automated build from the latest commit on `main`.

            **How to install in Chrome:**
            1. Download `snapmonk.zip` below
            2. Unzip it anywhere on your machine
            3. Open `chrome://extensions`
            4. Enable **Developer Mode** (top-right toggle)
            5. Click **Load unpacked** → select the unzipped folder
            6. Pin SnapMonk from the 🧩 toolbar menu

            > To update: repeat steps 1-5 (click the ↺ refresh icon on the card instead of Load unpacked if already installed).

            _Commit: ${{ github.sha }}_
          prerelease: true
          make_latest: true
          files: snapmonk.zip

      # Main branch: also expose the build as a downloadable Actions artifact
      # (in addition to the rolling "latest" release above).
      - name: Upload zip artifact (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: snapmonk-${{ env.VERSION }}
          path: snapmonk.zip
          retention-days: 30